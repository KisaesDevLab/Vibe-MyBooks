# Gitleaks configuration — extends the default ruleset with a docs and test-fixture allowlist.
[extend]
useDefault = true

[allowlist]
description = "In-app help documentation shows illustrative curl examples with placeholder credentials (YOUR_API_KEY, truncated eyJhbG...). Real secrets never live in this file. Tax-estimator parameter seeds are `key: '<dotted.parameter.name>'` rows (e.g. care.phase1.min_rate) that the generic-api-key rule misreads; they hold public tax amounts only."
paths = [
  '''packages/web/src/features/help/articles\.ts''',
  '''packages/api/src/db/seeds/tax-estimator/.*\.ts''',
  # Desktop-mode tests plant fake, credential-shaped canaries on purpose to prove
  # the secret scrubber, the env defaults and the launch-token handling work.
  # They are not real secrets; keep this list to exactly these test files.
  '''packages/api/src/utils/secret-scrubber\.test\.ts''',
  '''packages/api/src/config/env\.server-defaults\.test\.ts''',
  '''packages/api/src/config/__fixtures__/env-server-baseline\.json''',
  '''packages/api/src/desktop/profile\.test\.ts''',
  # Desktop AI config test: placeholder key values the config API must refuse.
  '''packages/api/src/services/ai-config\.desktop\.test\.ts''',
  # Closing-date password tests: placeholder passwords the engine must accept,
  # refuse or keep out of responses and the audit trail.
  '''packages/api/src/routes/closing-password\.routes\.test\.ts''',
  '''packages/api/src/routes/closing-password\.aje\.routes\.test\.ts''',
  '''packages/api/src/routes/transactions\.delete\.routes\.test\.ts''',
  '''packages/api/src/services/lock-context\.test\.ts''',
]
# Closing-date password placeholders in packages/api/src/routes/checks.routes.edit.test.ts
# (current lines carry gitleaks:allow; these two exact values also cover the
# branch's earlier commits). Not secrets: test-only values the engine must
# accept or refuse.
regexes = [
  '''closing-pass-123''',
  '''wrong-password''',
  # U-92 (document drafts): a closing-password test placeholder and the
  # idempotency list name in route descriptions, misread as API keys in
  # the branch's earlier commits.
  '''Closing-pass-2026''',
  '''idempotency-docs-v1''',
  # U-92d (document-reading assist): a deliberate privacy canary in
  # document-reading.routes.test.ts that must never reach ai_jobs or the
  # audit log, misread as a secret in the branch's earlier commits.
  '''ZZQ-PRIVATE-MEMO-7731''',
  # U-95 (attach a document draft): the capability name after
  # "Idempotency-Key:" in route descriptions and openapi.json, and a
  # closing-password test placeholder; neither is a secret.
  '''document-drafts-attach-v1''',
  '''closing-pass-u95''',
]
