#
# Browser security headers for the SPA documents/assets served by nginx.
# Included from every static `location` block in the web container's
# default.conf (nginx `add_header` is not inherited into locations that set
# their own headers, so each one includes this snippet explicitly).
#
# This lives in a real file (COPY'd into the image) rather than a
# `RUN printf '...'` in the Dockerfile on purpose: CSP keyword sources
# ('self', 'none', 'unsafe-inline', 'sha256-...') MUST be single-quoted, and
# a shell-quoted printf silently strips them — the browser then reads `self`
# as a hostname and every same-origin script/style becomes a violation.
#
# The document CSP is Report-Only. See docs/content-security-policy.md for
# the rollout procedure and the one-line promote-to-enforcing flip. The two
# sha256 hashes pin the static inline scripts in packages/web/index.html; a
# build-time guard in packages/web/Dockerfile fails the image if they drift.

add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# camera=(self): the portal receipt capture page (PortalCapturePage) calls
# getUserMedia in the top-level document. payment: Stripe's PaymentElement
# renders Apple Pay / Google Pay / Link inside the js.stripe.com iframe and
# needs the feature delegated to that origin.
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(self \"https://js.stripe.com\")" always;
# report-uri carries the base-path sentinel; docker-entrypoint.d/40-base-path.sh
# rewrites it (like the SPA assets) so sub-path deployments report to the
# right API. frame-src blob: — attachment/PDF previews render blob: URLs in
# an <iframe>. *.js.stripe.com is in Stripe's published CSP allowlist.
add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; img-src 'self' data: blob: https:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; script-src 'self' 'sha256-kp4I/hU7BOtqvPhnou0wcu8M6WPZCOX57gNSQ0TFOHw=' 'sha256-ytvBjpo4wUPLnd0xtdTN66/sq9CnYwbrNmghQJiz7ZE=' https://cdn.plaid.com https://js.stripe.com https://*.js.stripe.com https://challenges.cloudflare.com; connect-src 'self' https://*.plaid.com https://api.stripe.com https://production.plaid.com https://sandbox.plaid.com; frame-src 'self' blob: https://cdn.plaid.com https://*.plaid.com https://js.stripe.com https://*.js.stripe.com https://hooks.stripe.com https://challenges.cloudflare.com; report-uri /__VIBE_BASE_PATH__/api/v1/csp-report" always;
