#
# Production-dependency vulnerability audit.
#   - HIGH and CRITICAL findings fail the build (the tree is clean at high
#     since puppeteer 25 / react-router 7 — 2026-08-18).
#   - MODERATE+ findings are reported in the job summary but do not block.
name: Dependency audit
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC
  workflow_dispatch:
permissions:
  contents: read
jobs:
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Install (lockfile only)
        run: npm ci --ignore-scripts
      - name: Report (moderate+, non-blocking)
        continue-on-error: true
        run: |
          echo '## npm audit --omit=dev (moderate+)' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          npm audit --omit=dev --audit-level=moderate 2>&1 | tail -n 60 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Gate (high+ blocks)
        run: npm audit --omit=dev --audit-level=high
