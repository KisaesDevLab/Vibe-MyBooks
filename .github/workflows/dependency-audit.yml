#
# Production-dependency vulnerability audit.
#   - HIGH and CRITICAL findings fail the build, through scripts/audit-gate.mjs.
#     An advisory with no fix yet may be excepted in scripts/audit-exceptions.json
#     with its reason, mitigation and an expiry date; the gate prints every
#     active exception and fails again once the date passes. One exception
#     is open: zod GHSA-mrhx-c7xc-m3w5 until 2027-01-25 (zod 4 migration).
#   - MODERATE+ findings are reported in the job summary but do not block.
name: Dependency audit
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC
  workflow_dispatch:
permissions:
  contents: read
jobs:
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Install (lockfile only)
        run: npm ci --ignore-scripts
      - name: Report (moderate+, non-blocking)
        continue-on-error: true
        run: |
          echo '## npm audit --omit=dev (moderate+)' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          npm audit --omit=dev --audit-level=moderate 2>&1 | tail -n 60 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Gate (high+ blocks; documented, time-boxed exceptions allowed)
        run: node scripts/audit-gate.mjs
